# git-buildpackage configuration for chromium-embedded-framework
#
# This package has a NON-STANDARD workflow due to requiring Chromium source
# as a build input. See debian/README.source for full details.

[DEFAULT]
# Use pristine-tar for orig.tar.gz management
pristine-tar = True

# Upstream uses tags like "7444" for branch identifiers
upstream-tag = %(version)s

# Debian branch tracking
debian-branch = master
upstream-branch = upstream

[buildpackage]
# Export built packages to parent directory
export-dir = ../build-area/

# CRITICAL: Verify chromium tarball exists before building
# This package REQUIRES chromium source tarball in parent directory
prebuild = if [ ! -f ../chromium_*.orig.tar.xz ]; then \
           echo ""; \
           echo "ERROR: Chromium source tarball not found!"; \
           echo ""; \
           echo "This package requires Debian chromium source as build input."; \
           echo "Please run from parent directory:"; \
           echo "  $ apt-get source --download-only chromium"; \
           echo ""; \
           echo "Expected file: chromium_142.0.7444.59.orig.tar.xz (~961 MB)"; \
           echo ""; \
           echo "See debian/README.source for complete instructions."; \
           echo ""; \
           exit 1; \
         fi

# Don't purge build directory (useful for debugging)
purge = False

# Sign tags by default
sign-tags = True

[import-orig]
# Filter out any chromium tarballs from being imported as upstream source
# (They are build dependencies, not part of CEF source)
filter = [ 'chromium*.tar.xz', 'chromium*.tar.gz', 'depot_tools' ]

# Don't use pristine-tar for import (we manage orig.tar.gz manually)
pristine-tar = True

# Merge upstream changes into debian branch
merge = True

[dch]
# Automatically update debian/changelog
git-log = --first-parent

# Include full commit message
full = True

# Automatically update version based on git tags
auto = True

[pq]
# Patch queue branch naming
patch-numbers = True

[clone]
# Pristine tar when cloning
pristine-tar = True
