    # Obtain MUT tarballs
    - chmod +x ./${PKG}/debian/scripts/get-orig-tarballs.sh
    - ./${PKG}/debian/scripts/get-orig-tarballs.sh "$UPSTREAM_VERSION" "$CEF_BRANCH" "$CHROMIUM_VERSION" && cd ${PKG}

    # Build source package, then use sbuild for arm64 (QEMU emulation)
    - dpkg-source -b .
    - cd ..
    - |
      sbuild --arch=arm64 --host=arm64 --dist=experimental \
        --chroot-mode=unshare --no-clean-source \
        --build-dep-resolver=apt --verbose \
        ${PKG}_${UPSTREAM_VERSION}-*.dsc

    # Collect artifacts (sbuild output in current directory, source pkg too)
    - rm -rf ${CI_PROJECT_DIR}/build-output-arm64
    - mkdir -p ${CI_PROJECT_DIR}/build-output-arm64
    - cp *.deb *.buildinfo *.changes ${CI_PROJECT_DIR}/build-output-arm64/
    - cp ${PKG}_${UPSTREAM_VERSION}-*.dsc ${PKG}_${UPSTREAM_VERSION}-*.debian.tar.* ${CI_PROJECT_DIR}/build-output-arm64/

    # Export metadata for publish job
    - echo "BUILD_JOB_ID=${CI_JOB_ID}" > ${CI_PROJECT_DIR}/build-arm64.env
    - echo "DEB_VERSION=${DEB_VERSION}" >> ${CI_PROJECT_DIR}/build-arm64.env
    - echo "ARCH=arm64" >> ${CI_PROJECT_DIR}/build-arm64.env
    - echo "ARTIFACT_DIR=build-output-arm64" >> ${CI_PROJECT_DIR}/build-arm64.env

  artifacts:
    paths:
      - build-output-arm64/
    reports:
      dotenv: build-arm64.env
    expire_in: 30 days
    when: on_success

lintian-arm64:
  extends: .lintian-template
  needs: ["build-arm64"]
  variables:
    ARCH: arm64

publish-arm64:
  extends: .publish-template
  needs:
    - job: build-arm64
      artifacts: true

