---
# CEF multi-architecture build pipeline for Salsa custom runner
# Three independent chains: build -> check -> publish (one per arch)
# Any architecture can run alone or all together
#
# Requires custom runner -- shared runners have 3h timeout (CEF needs 7h+)

stages:
  - build
  - check
  - publish

variables:
  DEBIAN_FRONTEND: noninteractive
  PKG: chromium-embedded-framework
  # Exclude tmp/ from git clean -- sbuild chroot dirs are root-owned and
  # git clean cannot remove them, causing job failures on cleanup
  GIT_CLEAN_FLAGS: -ffdx -e tmp/

# ── Shared templates ──────────────────────────────────────────────────

.build-template:
  stage: build
  tags: ["cef-builder"]
  cache: []
  before_script:
    # Remove stale sbuild chroot directories (owned by root via usernsexec)
    - sudo rm -rf tmp/tmp.sbuild.* 2>/dev/null || true
  after_script:
    # Clean sbuild chroot leftovers so gitlab-runner's git clean can succeed
    - sudo rm -rf tmp/tmp.sbuild.* 2>/dev/null || true
  rules:
    - if: $GITLAB_USER_LOGIN == "mendezr"
      when: manual
    - when: never

.lintian-template:
  stage: check
  tags: ["cef-builder"]
  script:
    - lintian --info --display-info --pedantic build-output-${ARCH}/*.deb || true
  allow_failure: true

.publish-template:
  stage: publish
  tags: ["cef-builder"]
  rules:
    - if: $GITLAB_USER_LOGIN == "mendezr"
      when: on_success
    - when: never
  script:
    - DEB_VERSION=$(dpkg-parsechangelog -S Version)
    - >-
      export ARCH DEB_VERSION
      BUILD_JOB_ID ARTIFACT_DIR
      CI_API_V4_URL CI_PROJECT_ID CI_PROJECT_URL CI_COMMIT_SHA
      SALSA_API_TOKEN
    - python3 debian/scripts/publish-release.py

# ── amd64 chain ───────────────────────────────────────────────────────

build-amd64:
  extends: .build-template
  timeout: 8h
  script:
    - UPSTREAM_VERSION=$(dpkg-parsechangelog -S Version | cut -d'-' -f1)
    - DEB_VERSION=$(dpkg-parsechangelog -S Version)
    - echo "Building CEF ${UPSTREAM_VERSION} for amd64"
    - echo "CPU cores:$(nproc) RAM:$(free -h | grep Mem | awk '{print $2}') Disk:$(df -h . | tail -1 | awk '{print $4}')"

    - export TMPDIR="$PWD/tmp"
    - mkdir -p "$TMPDIR"

    - CHROMIUM_VERSION=$(sed -n 's/^CHROMIUM_VERSION := //p' debian/rules)
    - CEF_BRANCH=$(echo "$CHROMIUM_VERSION" | cut -d. -f3)
    - echo "Chromium ${CHROMIUM_VERSION}, CEF branch ${CEF_BRANCH}"

    # Clean stale files from previous runs
    - cd .. && rm -f ${PKG}_*.orig*.tar.xz ${PKG}_*.debian.tar.xz ${PKG}_*.dsc chromium_*.tar.xz chromium_*.dsc *.deb *.buildinfo *.changes

    # Obtain MUT tarballs
    - chmod +x ./${PKG}/debian/scripts/get-orig-tarballs.sh
    - ./${PKG}/debian/scripts/get-orig-tarballs.sh "$UPSTREAM_VERSION" "$CEF_BRANCH" "$CHROMIUM_VERSION" && cd ${PKG}

    # Build source package, then use sbuild for clean chroot build
    - dpkg-source -b .
    - cd ..
    - |
      sbuild --arch=amd64 --dist=experimental \
        --chroot-mode=unshare --no-clean-source \
        --build-dep-resolver=apt --verbose \
        ${PKG}_${UPSTREAM_VERSION}-*.dsc

    # Collect artifacts (sbuild output in current directory, source pkg too)
    - rm -rf ${CI_PROJECT_DIR}/build-output-amd64
    - mkdir -p ${CI_PROJECT_DIR}/build-output-amd64
    - cp *.deb *.buildinfo *.changes ${CI_PROJECT_DIR}/build-output-amd64/
    - cp ${PKG}_${UPSTREAM_VERSION}-*.dsc ${PKG}_${UPSTREAM_VERSION}-*.debian.tar.* ${CI_PROJECT_DIR}/build-output-amd64/

    # Export metadata for publish job
    - echo "BUILD_JOB_ID=${CI_JOB_ID}" > ${CI_PROJECT_DIR}/build-amd64.env
    - echo "DEB_VERSION=${DEB_VERSION}" >> ${CI_PROJECT_DIR}/build-amd64.env
    - echo "ARCH=amd64" >> ${CI_PROJECT_DIR}/build-amd64.env
    - echo "ARTIFACT_DIR=build-output-amd64" >> ${CI_PROJECT_DIR}/build-amd64.env

  artifacts:
    paths:
      - build-output-amd64/
    reports:
      dotenv: build-amd64.env
    expire_in: 30 days
    when: on_success

lintian-amd64:
  extends: .lintian-template
  needs: ["build-amd64"]
  variables:
    ARCH: amd64

publish-amd64:
  extends: .publish-template
  needs:
    - job: build-amd64
      artifacts: true

# ── arm64 chain ───────────────────────────────────────────────────────

build-arm64:
  extends: .build-template
  timeout: 72h
  script:
    - UPSTREAM_VERSION=$(dpkg-parsechangelog -S Version | cut -d'-' -f1)
    - DEB_VERSION=$(dpkg-parsechangelog -S Version)
    - echo "Building CEF ${UPSTREAM_VERSION} for arm64"
    - echo "CPU cores:$(nproc) RAM:$(free -h | grep Mem | awk '{print $2}') Disk:$(df -h . | tail -1 | awk '{print $4}')"

    - export TMPDIR="$PWD/tmp"
    - mkdir -p "$TMPDIR"

    - CHROMIUM_VERSION=$(sed -n 's/^CHROMIUM_VERSION := //p' debian/rules)
    - CEF_BRANCH=$(echo "$CHROMIUM_VERSION" | cut -d. -f3)
    - echo "Chromium ${CHROMIUM_VERSION}, CEF branch ${CEF_BRANCH}"

    # Clean stale files from previous runs
