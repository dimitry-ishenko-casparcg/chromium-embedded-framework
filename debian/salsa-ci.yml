---
# CEF build pipeline for Salsa custom runner
# Requires custom runner — shared runners have 3h timeout (CEF needs 7h+)

stages:
  - build
  - check

variables:
  DEBIAN_FRONTEND: noninteractive
  PKG: chromium-embedded-framework

build-cef:
  stage: build
  tags: ["cef-builder"]
  timeout: 24h
  rules:
    - if: $GITLAB_USER_LOGIN == "mendezr"
      when: manual
    - when: never
  script:
    - UPSTREAM_VERSION=$(dpkg-parsechangelog -S Version | cut -d'-' -f1)
    - echo "Building CEF ${UPSTREAM_VERSION}"

    # Show runner capabilities
    - echo "CPU cores:$(nproc) RAM:$(free -h | grep Mem | awk '{print $2}') Disk:$(df -h . | tail -1 | awk '{print $4}')"

    - export TMPDIR="$PWD/tmp"
    - mkdir -p "$TMPDIR"

    # Extract Chromium version and CEF branch from debian/rules
    - CHROMIUM_VERSION=$(sed -n 's/^CHROMIUM_VERSION := //p' debian/rules)
    - CHROMIUM_DEBIAN_REV=$(sed -n 's/^CHROMIUM_DEBIAN_REV := //p' debian/rules)
    - CEF_BRANCH=$(echo "$CHROMIUM_VERSION" | cut -d. -f3)
    - echo "Chromium ${CHROMIUM_VERSION}-${CHROMIUM_DEBIAN_REV}, CEF branch ${CEF_BRANCH}"

    # Obtain MUT tarballs (script skips existing ones)
    - chmod +x debian/scripts/get-orig-tarballs.sh
    - cd .. && ./${PKG}/debian/scripts/get-orig-tarballs.sh "$UPSTREAM_VERSION" "$CEF_BRANCH" "${CHROMIUM_VERSION}-${CHROMIUM_DEBIAN_REV}" && cd ${PKG}

    # Follow the exact README.source workflow (dpkg-source -b / -x)
    # This is the same path a Debian Developer would take
    - dpkg-source -b .
    - cd ..
    - dpkg-source -x ${PKG}_${UPSTREAM_VERSION}-*.dsc build-dir
    - cd build-dir
    - dpkg-buildpackage -b -us -uc

    # Copy artifacts back into project dir (GitLab artifacts must be within $CI_PROJECT_DIR)
    - mkdir -p ${CI_PROJECT_DIR}/build-output
    - cp ../*.deb ../*.buildinfo ../*.changes ${CI_PROJECT_DIR}/build-output/ || true

  artifacts:
    paths:
      - build-output/
    expire_in: 30 days
    when: on_success

lintian:
  stage: check
  tags: ["cef-builder"]
  needs: ["build-cef"]
  script:
    - lintian --info --display-info --pedantic build-output/*.deb || true
  allow_failure: true
