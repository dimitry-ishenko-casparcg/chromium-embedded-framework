---
# CEF build pipeline for Salsa custom runner
# Requires custom runner — shared runners have 3h timeout (CEF needs 7h+)

stages:
  - build
  - check

variables:
  DEBIAN_FRONTEND: noninteractive
  PKG: chromium-embedded-framework

build-cef:
  stage: build
  tags: ["cef-builder"]
  timeout: 24h
  rules:
    - if: $GITLAB_USER_LOGIN == "mendezr"
      when: manual
    - when: never
  script:
    - UPSTREAM_VERSION=$(dpkg-parsechangelog -S Version | cut -d'-' -f1)
    - echo "Building CEF ${UPSTREAM_VERSION}"

    # Show runner capabilities
    - echo "CPU cores:$(nproc) RAM:$(free -h | grep Mem | awk '{print $2}') Disk:$(df -h . | tail -1 | awk '{print $4}')"

    - export TMPDIR="$PWD/tmp"
    - mkdir -p "$TMPDIR"

    # Extract Chromium version and CEF branch from debian/rules
    - CHROMIUM_VERSION=$(sed -n 's/^CHROMIUM_VERSION := //p' debian/rules)
    - CEF_BRANCH=$(echo "$CHROMIUM_VERSION" | cut -d. -f3)
    - echo "Chromium ${CHROMIUM_VERSION}, CEF branch ${CEF_BRANCH}"

    # Clean stale tarballs from previous runs to ensure correct versions
    - cd .. && rm -f ${PKG}_*.orig*.tar.xz ${PKG}_*.debian.tar.xz ${PKG}_*.dsc chromium_*.tar.xz chromium_*.dsc

    # Obtain MUT tarballs (4 components: cef, chromium, chromium-debian, depot-tools)
    - chmod +x ./${PKG}/debian/scripts/get-orig-tarballs.sh
    - ./${PKG}/debian/scripts/get-orig-tarballs.sh "$UPSTREAM_VERSION" "$CEF_BRANCH" "$CHROMIUM_VERSION" && cd ${PKG}

    # Follow the exact README.source workflow (dpkg-source -b / -x)
    # This is the same path a Debian Developer would take
    - dpkg-source -b .
    - cd ..
    - rm -rf build-dir
    - dpkg-source -x ${PKG}_${UPSTREAM_VERSION}-*.dsc build-dir
    - cd build-dir
    - dpkg-buildpackage -b -us -uc

    # Publish each file individually to the Generic Package Registry
    # Debian developers can download files one by one or dget the .dsc directly:
    #   dget https://salsa.debian.org/mendezr/chromium-embedded-framework/-/package_files/.../download
    - DEB_VERSION=$(dpkg-parsechangelog --file build-dir/debian/changelog -S Version)
    - |
      for f in ../*.deb ../*.dsc ../*.buildinfo ../*.changes; do
        [ -f "$f" ] || continue
        FILENAME=$(basename "$f")
        echo "Uploading ${FILENAME} ..."
        curl --silent --show-error --fail \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG}/${DEB_VERSION}/${FILENAME}"
      done

    # Keep .deb files as job artifacts for the lintian stage
    - rm -rf ${CI_PROJECT_DIR}/build-output
    - mkdir -p ${CI_PROJECT_DIR}/build-output
    - cp ../*.deb ${CI_PROJECT_DIR}/build-output/

  artifacts:
    paths:
      - build-output/
    expire_in: 7 days
    when: on_success

lintian:
  stage: check
  tags: ["cef-builder"]
  needs: ["build-cef"]
  script:
    - lintian --info --display-info --pedantic build-output/*.deb || true
  allow_failure: true
